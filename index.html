<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#07080b" />
    <meta name="color-scheme" content="dark" />

    <title>Samuele Corrà — Technical Hub</title>
    <meta
      name="description"
      content="Personal technical hub of Samuele Corrà: projects, a public cybersecurity knowledge archive, and links to the evidence behind them."
    />
    <meta name="author" content="Samuele Corrà" />

    <!--
      %SITE_URL% is replaced at build time from site.config.json — see
      vite.config.ts. Absolute URLs are required here because crawlers do not
      execute JavaScript. See docs/ARCHITECTURE.md § SEO.
    -->
    <link rel="canonical" href="%SITE_URL%/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:site_name" content="Samuele Corrà" />
    <meta property="og:title" content="Samuele Corrà — Technical Hub" />
    <meta
      property="og:description"
      content="Projects, a public cybersecurity knowledge archive, and links to the evidence behind them."
    />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Samuele Corrà — Cybersecurity, Software Engineering, AI"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="%SITE_URL%/" />
    <meta name="twitter:title" content="Samuele Corrà — Technical Hub" />
    <meta
      name="twitter:description"
      content="Projects, a public cybersecurity knowledge archive, and links to the evidence behind them."
    />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
